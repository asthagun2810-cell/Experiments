<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>experiment 5</title>
</head>
<body>
    <center><h1>Student Registration Form</h1></center>
    <fieldset>
        <label for="name">Full Name:</label>
        <input type="name" name="name" id="name " placeholder="Enter your full name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter valid email address">
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" placeholder="Enter password">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gender"><label for="gender">male</label>
        <input type="radio" name="gender" id="gender"><label for="gender">female</label>
        <input type="radio" name="gender" id="gender"><label for="gender">other</label>
        <br><br>
        <label for="coures">Course:</label>
        <select name="coures" id="course">
        <option value="Select Course">--Select coures--</option>
        </select>
        <br><br>
        <label for="tel">Contact No:</label>
        <input type="tel" name="tel" id="tel" placeholder="Enter phone number">
        <br><br>
        <label for="add">Address:</label><br>
        <textarea name="add" id="" placeholder="Enter your address"></textarea>
        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
        <br>
    </fieldset>
    <center>&copy; 2025 Student Regestration Portal
    </center>
</body>
</html>

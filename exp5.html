<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>experiment 5</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <fieldset>
        <label for="name">Full Name:</label>
        <input type="name" name="name" id="name " placeholder="enter your full name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="enter valid email address">
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" placeholder="enter password">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gender"><label for="gender">male</label>
        <input type="radio" name="gender" id="gender"><label for="gender">female</label>
        <input type="radio" name="gender" id="gender"><label for="gender">other</label>
        <br><br>
        <label for="coures">Course:</label>
        <select name="coures" id="">course</select>
        <option value="select course"></option>
        <br><br>
        <label for="tel">Contact No:</label>
        <input type="tel" name="tel" id="tel">
        <br><br>
        <label for="add">Address:</label>
        <textarea name="add" id="">enter your address</textarea>
        <br><br>
        <input type="submit" value="register">
        <input type="reset" value="clear">
    </fieldset>
</body>
</html>
